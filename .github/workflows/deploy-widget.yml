# Publishes the widget's server to Cloudflare, which serves it at widget.joinhaptic.com.
#
# It runs when a change to the server or the widget lands on main, and can also
# be started by hand from the Actions tab. Pull requests never run it, so
# nothing goes live before a merge.
#
# It uses the same two repository secrets as the site's deploy, under Settings,
# Secrets and variables, Actions:
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account the Worker lives in
# and one more, which the server needs to call a real model:
#   ANTHROPIC_API_KEY      copied onto the Worker as a secret on every deploy
# Without it the deploy still goes ahead, and the server works only while
# HAPTIC_MODEL in wrangler.jsonc is "mock".
# And for billing, optional:
#   STRIPE_SECRET_KEY      copied onto the Worker, so a finished guide reaches Stripe at once.
#                          Without it the site's Worker sends it within the hour.

name: Deploy widget server

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "worker/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

# One deploy at a time. A second one waits for the first to finish.
concurrency:
  group: deploy-widget
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the Cloudflare secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings, Secrets and variables, Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Tested in a real browser before anything is published: how the widget reads a
      # page, that nothing a visitor typed leaves it, and main's widget tests (dialogs,
      # covered controls, route changes, learning, ruled-out controls), in Chromium.
      - name: Install a browser
        run: npx playwright install --with-deps chromium

      - name: Test the widget in a browser
        env:
          BROWSERS: chromium
        run: npm run test:browser

      # "Do it with me" must never press what saves, sends, pays or deletes, nor type
      # what it must not: the gate's tests and the red-team pages. About two minutes.
      - name: Test that acting stays safe
        run: npx tsx --test --test-concurrency=1 test/widget/gate.test.ts test/widget/acting-redteam.test.ts

      # Before the publish, so new code finds its tables. Migrations only add, so the code
      # already live keeps working on the migrated database.
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::There is no DATABASE_URL secret, so migrations were not applied. Run npm run db:migrate by hand."
            exit 0
          fi
          npm run db:migrate

      # Builds the widget, packs it into the Worker and publishes it.
      - name: Build and publish
        run: npm run deploy

      # After the publish, so the Worker exists the first time. Setting a secret
      # takes effect at once and does not need another deploy.
      - name: Put the model key on the server
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::There is no ANTHROPIC_API_KEY secret, so the server has no model key. It answers only while HAPTIC_MODEL is \"mock\"."
            exit 0
          fi
          printf '%s' "$KEY" | npx wrangler secret put ANTHROPIC_API_KEY

      - name: Put the Stripe key on the server
        env:
          KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::There is no STRIPE_SECRET_KEY secret, so finished guides reach Stripe from the site's hourly sweep instead of at once."
            exit 0
          fi
          printf '%s' "$KEY" | npx wrangler secret put STRIPE_SECRET_KEY

      - name: Check the live server answers
        run: |
          for attempt in 1 2 3 4 5; do
            # Both of the widget's files: the second is the code that acts, loaded on sites with acting on.
            if curl --fail --silent --show-error --output /dev/null https://widget.joinhaptic.com/widget.js && curl --fail --silent --show-error --output /dev/null https://widget.joinhaptic.com/widget-act.js; then
              echo "widget.joinhaptic.com is up."
              exit 0
            fi
            sleep 6
          done
          echo "::error::widget.joinhaptic.com did not answer after the deploy."
          exit 1
