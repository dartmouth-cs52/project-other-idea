# Publishes the staging copy of the widget server and gives it the model key.
#
# It runs when the branch called "staging" is pushed, and never touches the
# live server. The staging server is for measuring a change to the prompt or
# the server against the real model before visitors get it: see
# wrangler.staging.jsonc. Once the key is on it, a change can also be
# published straight from a terminal, and the key stays.
#
# It uses the same repository secrets as the live deploy: CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID and ANTHROPIC_API_KEY.

name: Deploy staging server

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy staging to Cloudflare
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Build and publish
        run: npx wrangler deploy -c wrangler.staging.jsonc

      - name: Put the model key on the staging server
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::There is no ANTHROPIC_API_KEY secret, so the staging server cannot call a model."
            exit 1
          fi
          printf '%s' "$KEY" | npx wrangler secret put ANTHROPIC_API_KEY -c wrangler.staging.jsonc

      - name: Check the staging server answers
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --output /dev/null https://haptic-widget-staging.joinhaptic.workers.dev/widget.js; then
              echo "The staging server is up."
              exit 0
            fi
            sleep 6
          done
          echo "::error::The staging server did not answer after the deploy."
          exit 1
