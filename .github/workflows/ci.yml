name: CI

on:
  push:
  pull_request:

jobs:
  server:
    name: Widget and server
    runs-on: ubuntu-latest
    # The tests that run the site Worker's queries need a Postgres. Never a real one: this one lives and dies with the job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The Worker's tests that need the site's own packages. The rest run in the job above.
      - run: npm test
      - run: npm run build

  testbed:
    name: Northpine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testbed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: testbed/package-lock.json
      - run: npm ci
      - run: npm run build
      # Northpine is the live demo, and the page under Haptic on a phone. A page wider than the phone puts everything
      # fixed to the window off the screen, Haptic's launcher among them, and a field with small words makes the phone
      # zoom in. Every page is looked at as a phone shows it (scripts/phone-check.ts).
      - name: Check every page fits a phone
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4200 --strictPort > preview.log 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://localhost:4200/ > /dev/null && break; sleep 1; done
          npm run -s phone:check
