# Publishes the website in web/ to Cloudflare, which serves it at joinhaptic.com.
#
# It runs when a change to the site lands on main, and can also be started by hand
# from the Actions tab. Pull requests never run it, so nothing goes live before a merge.
#
# It needs two repository secrets, under Settings, Secrets and variables, Actions:
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account the Worker lives in

name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      # A change to the docs alone does not need a deploy.
      - "!web/**/*.md"
  workflow_dispatch:

# One deploy at a time. A second one waits for the first to finish.
concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check the Cloudflare secrets are set
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: .
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings, Secrets and variables, Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint

      # Builds the pages, packs them into the Worker and publishes it. The build also checks types.
      - name: Build and publish
        run: npm run deploy:embedded
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check the live site answers
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --output /dev/null https://joinhaptic.com/; then
              echo "joinhaptic.com is up."
              exit 0
            fi
            sleep 6
          done
          echo "::error::joinhaptic.com did not answer after the deploy."
          exit 1
