# Publishes the website in web/ to Cloudflare, which serves it at joinhaptic.com.
#
# It runs when a change to the site lands on main, and can also be started by hand
# from the Actions tab. Pull requests never run it, so nothing goes live before a merge.
#
# It needs three repository secrets, under Settings, Secrets and variables, Actions:
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account the Worker lives in
#   DATABASE_URL           Neon's connection string for the haptic project's main branch,
#                          which the deploy brings up to date with db/migrations before it publishes
# and, for billing, three optional ones:
#   STRIPE_SECRET_KEY      Stripe's secret key, copied onto the Worker on every deploy
#   STRIPE_WEBHOOK_SECRET  signs Stripe's webhooks to /api/stripe/webhook, copied onto the Worker too
#   STRIPE_PRICES_KEY      a read-only Stripe key for the price check below. STRIPE_SECRET_KEY is used without it

name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      # A change to the docs alone does not need a deploy.
      - "!web/**/*.md"
      - "db/migrations/**"
  workflow_dispatch:

# One deploy at a time. A second one waits for the first to finish.
concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # A deploy without the database's secret would publish pages whose tables may not exist yet, so it stops here.
      - name: Check the secrets are set
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: .
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings, Secrets and variables, Actions."
            exit 1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add DATABASE_URL, Neon's connection string for the haptic project's main branch, under Settings, Secrets and variables, Actions. Without it no migration is applied, and code that needs a new table fails."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            package-lock.json

      - run: npm ci

      - run: npm run lint

      # Stripe must charge what the pricing page says. A price changed in lib/site.ts
      # and not yet in Stripe stops the deploy until `npm run stripe:setup` is run.
      # STRIPE_PRICES_KEY is a restricted key that can only read billing meters,
      # products, prices and the customer portal. Without it STRIPE_SECRET_KEY is
      # used, and without either this only warns.
      - name: Check Stripe charges what the pricing page says
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_PRICES_KEY || secrets.STRIPE_SECRET_KEY }}
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::warning::There is no STRIPE_PRICES_KEY or STRIPE_SECRET_KEY secret, so Stripe's prices were not checked against lib/site.ts."
            exit 0
          fi
          npm run stripe:check

      # Before the publish, so the dashboard's Worker finds its tables, and after the checks that
      # can stop the deploy, so a deploy stopped by them changes nothing in the database. The
      # migration runner is the repository's own, at the top. Migrations only add, so the site
      # already live keeps working on the migrated database. The widget server's deploy runs this
      # too, and the runner skips a migration the other deploy applied at the same moment.
      - name: Apply database migrations
        working-directory: .
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm ci
          npm run db:migrate

      # Builds the pages, packs them into the Worker and publishes it. The build also checks types.
      - name: Build and publish
        run: npm run deploy:embedded
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # After the publish, so the Worker exists. A secret takes effect at once and needs no other deploy.
      # Billing stays switched off on the dashboard until both are there.
      - name: Put the Stripe keys on the Worker
        env:
          KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          WEBHOOK: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$KEY" ] || [ -z "$WEBHOOK" ]; then
            echo "::warning::STRIPE_SECRET_KEY or STRIPE_WEBHOOK_SECRET is missing, so billing is not switched on. See Billing in web/README.md."
            exit 0
          fi
          printf '%s' "$KEY" | npx wrangler secret put STRIPE_SECRET_KEY -c wrangler.embedded.jsonc
          printf '%s' "$WEBHOOK" | npx wrangler secret put STRIPE_WEBHOOK_SECRET -c wrangler.embedded.jsonc

      - name: Check the live site answers
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --output /dev/null https://joinhaptic.com/; then
              echo "joinhaptic.com is up."
              exit 0
            fi
            sleep 6
          done
          echo "::error::joinhaptic.com did not answer after the deploy."
          exit 1
