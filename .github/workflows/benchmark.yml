# Runs the benchmark in eval/ against real models and prints the table.
#
# It is started by hand from the Actions tab and never runs on its own, because
# every call is billed. It signs in to the Claude API in one of two ways,
# set under Settings, Secrets and variables, Actions.
#
# With a key: one repository secret.
#   ANTHROPIC_API_KEY
#
# Without a key, by workload identity federation, where GitHub vouches for the
# run: three repository variables. They are IDs, not secrets.
#   ANTHROPIC_FEDERATION_RULE_ID   the federation rule, fdrl_...
#   ANTHROPIC_SERVICE_ACCOUNT_ID   the service account the rule acts as, svac_...
#   ANTHROPIC_ORGANIZATION_ID      from platform.claude.com/settings/organization
#   ANTHROPIC_WORKSPACE_ID         only if the rule covers more than one workspace
# The rule trusts runs from main only, so start the workflow on main.
#
# When both are set, the key is used.

name: Benchmark

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Models to compare, comma-separated. After @: low, medium or high effort, and off for no thinking."
        default: "claude-opus-5-5,claude-sonnet-5-5,claude-haiku-5-5"
      repeat:
        description: "Times to ask each case. Three shows which cases a model gets right only sometimes, and costs three times as much."
        default: "1"
      cases:
        description: "Case files to run, comma-separated, like demo,hard,ui5. Empty runs all of them."
        default: ""
      guides:
        description: "Guide sets to run start to finish in a browser, separated by spaces, like: demo hard ui5. Empty skips this."
        default: ""
      guides_model:
        description: "The one model that runs the whole guides."
        default: "claude-sonnet-5-5"

# Lets the run ask GitHub for the token that proves which repository and branch it is.
permissions:
  id-token: write
  contents: read

jobs:
  benchmark:
    name: Run the benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      MODELS: ${{ inputs.models }}
      REPEAT: ${{ inputs.repeat }}
      CASES: ${{ inputs.cases }}
      GUIDES: ${{ inputs.guides }}
      GUIDES_MODEL: ${{ inputs.guides_model }}
    steps:
      # Each setting is passed on only when it has a value. An empty key would
      # still take the place of federation, and an empty workspace would be sent as one.
      - name: Choose how to sign in to the Claude API
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RULE: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ACCOUNT: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ORGANIZATION: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          WORKSPACE: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          if [ -n "$KEY" ]; then
            echo "Signing in with the ANTHROPIC_API_KEY secret."
            echo "ANTHROPIC_API_KEY=$KEY" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$RULE" ] || [ -z "$ACCOUNT" ] || [ -z "$ORGANIZATION" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY secret, or the three federation variables, under Settings, Secrets and variables, Actions. The top of this workflow lists them."
            exit 1
          fi
          echo "Signing in with workload identity federation."
          {
            echo "ANTHROPIC_FEDERATION_RULE_ID=$RULE"
            echo "ANTHROPIC_SERVICE_ACCOUNT_ID=$ACCOUNT"
            echo "ANTHROPIC_ORGANIZATION_ID=$ORGANIZATION"
            echo "ANTHROPIC_IDENTITY_TOKEN_FILE=/tmp/github-identity-token"
          } >> "$GITHUB_ENV"
          if [ -n "$WORKSPACE" ]; then echo "ANTHROPIC_WORKSPACE_ID=$WORKSPACE" >> "$GITHUB_ENV"; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub's token lasts about five minutes and can be used once, and a run
      # can outlast the access it buys. So a fresh one is fetched every three
      # minutes, and the SDK reads the file again whenever it has to renew.
      - name: Keep a fresh identity token on disk
        if: env.ANTHROPIC_IDENTITY_TOKEN_FILE != ''
        run: |
          fetch() {
            curl -sS --fail -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.new" \
              && mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.new" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          fetch
          (while sleep 180; do fetch; done) &

      - name: Run the benchmark
        run: |
          set -o pipefail
          npm run -s eval -- --models "$MODELS" --repeat "$REPEAT" ${CASES:+--cases "$CASES"} --yes | tee benchmark.txt
          # The summary gets the tables. The line printed for every call stays in the log.
          { echo '```'; grep -v '^turn ' benchmark.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Whole guides need a browser, and the demo app's pages need this project's own server.
      - name: Run whole guides in a browser
        if: inputs.guides != ''
        run: |
          set -o pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          HAPTIC_MODEL=mock npm run -s start > server.log 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://localhost:4000/demo/ > /dev/null && break; sleep 1; done
          # shellcheck disable=SC2086
          npm run -s eval:guides -- $GUIDES --model "$GUIDES_MODEL" | tee guides.txt
          { echo '```'; grep -v '^turn ' guides.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep every answer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: eval/results/
          if-no-files-found: ignore
