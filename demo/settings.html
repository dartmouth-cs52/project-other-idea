<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Acme Console</title>
<link rel="stylesheet" href="/demo/style.css">
</head>
<body>
<header>
  <a class="brand" href="/demo/">Acme Console</a>
  <nav>
    <a href="/demo/">Overview</a>
    <a href="/demo/projects">Projects</a>
    <a href="/demo/team">Team</a>
  </nav>
  <div class="account">
    <button id="account-button" aria-expanded="false" aria-haspopup="menu">A</button>
    <div id="account-menu" role="menu" hidden>
      <a role="menuitem" href="/demo/settings">Settings</a>
      <a role="menuitem" href="/demo/settings-billing">Plan and billing</a>
      <a role="menuitem" href="/demo/">Sign out</a>
    </div>
  </div>
</header>
<main>
<h1>Settings</h1>
<div class="tabs" role="tablist"><a role="tab" aria-selected="true" href="/demo/settings">General</a><a role="tab" href="/demo/settings-billing">Plan and billing</a><a role="tab" href="/demo/settings-security">Security</a></div>
<form id="general"><label>Workspace name <input name="workspace" value="Acme"></label><label>Time zone <select><option>UTC</option><option>Eastern</option><option>Pacific</option></select></label><button class="primary">Save changes</button></form>
<p id="general-result" role="status"></p>
</main>
<script src="/demo/app.js"></script>
<script src="/widget.js" data-site="site_demo" async></script>
</body>
</html>
