<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects · Acme Console</title>
<link rel="stylesheet" href="/demo/style.css">
</head>
<body>
<header>
  <a class="brand" href="/demo/">Acme Console</a>
  <nav>
    <a href="/demo/">Overview</a>
    <a href="/demo/projects">Projects</a>
    <a href="/demo/team">Team</a>
  </nav>
  <div class="account">
    <button id="account-button" aria-expanded="false" aria-haspopup="menu">A</button>
    <div id="account-menu" role="menu" hidden>
      <a role="menuitem" href="/demo/settings">Settings</a>
      <a role="menuitem" href="/demo/settings-billing">Plan and billing</a>
      <a role="menuitem" href="/demo/">Sign out</a>
    </div>
  </div>
</header>
<main>
<h1>Projects</h1>
<button id="new-project">New project</button>
<ul class="list" id="projects"><li>storefront-api</li><li>marketing-site</li><li>internal-tools</li></ul>
<dialog id="project-dialog" aria-labelledby="project-title">
  <h2 id="project-title">New project</h2>
  <form method="dialog">
    <label>Project name <input name="name" required></label>
    <label>Region <select name="region"><option>US East</option><option>EU West</option></select></label>
    <div class="row"><button value="cancel" formnovalidate>Cancel</button><button value="create" class="primary">Create project</button></div>
  </form>
</dialog>
</main>
<script src="/demo/app.js"></script>
<script src="/widget.js" data-site="site_demo" async></script>
</body>
</html>
