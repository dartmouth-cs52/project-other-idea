<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 673 248" width="673" height="248" role="img" aria-label="Haptic">
  <title>Haptic</title>
  <!-- The Haptic lockup for dark backgrounds: the live pointer beside the name. See DESIGN.md, "The lockup".
       The pointer is the path in assets/pointer.svg with its white border, and its two-layer shadow at the
       strength it has in the link preview image (web/app/opengraph-image.png).
       The name is Geist Medium drawn as outlines, so it looks the same where Geist cannot be loaded. -->
